<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memphis Roots</title>
<!--
  THE FRONT DOOR IS THE MAP.

  This file used to be the Clayborn Time Machine, a separate scrollytelling build, and it
  was the first thing anybody landed on. Judy's call, 2026-08-05: send people to the map
  instead. What this project is now lives on the map's "Why Clayborn" screen, which is
  built from the same registry as everything else and cannot drift the way a second page
  does.

  THE SCROLLYTELLING IS NOT DELETED. It is `clayborn-time-machine.html`, in this folder,
  unchanged and still working. Nothing links to it, which is the point, but a redirect is
  a decision that should be reversible in one commit and deleting the page would not have
  been. If it comes back, it comes back from there.

  The query string and hash are carried across, so a shared ?story= link that lands on
  the root still opens that story rather than dumping somebody on the default map.

  Belt and braces on purpose: the script is instant and the meta refresh covers a browser
  that will not run it. The visible line is for the half second in between, and for
  anybody the other two fail.
-->
<link rel="canonical" href="app.html">
<meta name="robots" content="noindex">
<script>location.replace("app.html" + location.search + location.hash);</script>
<meta http-equiv="refresh" content="0; url=app.html">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FFFDF4;
    color:#241C3B;font-family:'Plus Jakarta Sans',system-ui,sans-serif;text-align:center;padding:24px}
  a{color:#D81E5B;font-weight:700}
</style>
</head>
<body>
  <p>Taking you to the map. <a href="app.html">Memphis Roots</a></p>
</body>
</html>
